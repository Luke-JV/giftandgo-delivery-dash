<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Gift&Go Delivery Dash</title><style>body{margin:0;padding:16px;background:#F4F6FB;font-family:system-ui} @media(max-width:400px){body{padding:0}}</style></head><body>
<div id="giftgo-delivery-dash-preview">
<section class="delivery-dash" aria-label="Gift and Go Delivery Dash driving game">
  <header class="dash-header">
    <img data-brand-logo width="88" height="21" alt="Gift&amp;Go" />
    <small class="dash-version">v0.2</small>
    <button class="dash-icon-button dash-header-first" type="button" data-action="fullscreen" aria-label="Enter fullscreen" aria-pressed="false">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" data-fullscreen-icon><path d="M1 6V1h5M10 1h5v5M15 10v5h-5M6 15H1v-5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    </button>
    <button class="dash-icon-button" type="button" data-action="pause" aria-label="Pause" disabled>
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path data-pause-icon d="M3.5 2h3v12h-3zM9.5 2h3v12h-3z" fill="currentColor"/></svg>
    </button>
  </header>
  <div class="dash-scene" data-scene>
    <canvas data-game-canvas width="240" height="230" aria-label="Three-lane road. Steer left and right to dodge cones, barriers, traffic drums and potholes. Collect gifts, and grab the rare golden coupon, as the pace increases."></canvas>
    <img class="dash-truck-logo" data-truck-logo alt="" aria-hidden="true" />
    <div class="dash-hud" aria-label="Run statistics">
      <span class="dash-score" data-score-box>
        <span class="dash-pill"><span data-score>0</span><small>pts</small><span class="dash-mult" data-multiplier>×1</span></span>
        <span class="dash-chain" aria-hidden="true"><span data-chain-fill></span></span>
      </span>
      <span class="dash-pill dash-pill-points" aria-label="Gift points to spend at shops">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M2 6h12v3H2zM3 9h10v5H3zM7 6h2v8H7z" fill="currentColor"/><path d="M8 6C6 2 3 3 4 6M8 6c2-4 5-3 4 0" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        <span data-points>0</span>
      </span>
    </div>
    <div class="dash-perks" data-perks hidden></div>
    <div class="dash-delivery" data-delivery hidden>
      <span data-delivery-text></span>
      <span class="dash-delivery-bar" aria-hidden="true"><span data-delivery-fill></span></span>
    </div>
    <span class="dash-toast" data-toast hidden></span>
    <span class="dash-streak-call" data-streak-call aria-hidden="true" hidden></span>
    <span class="dash-snappy" data-snappy aria-hidden="true" hidden><span class="dash-snappy-word">SNAPPY</span><span class="dash-snappy-points" data-snappy-points></span></span>
    <div class="dash-swipe-hint" data-swipe-hint aria-hidden="true" hidden>
      <div class="dash-swipe-track">
        <svg class="dash-swipe-chevron dash-swipe-chevron-left" viewBox="0 0 16 12" width="20" height="15"><path d="M7 1L2 6l5 5M14 1L9 6l5 5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="dash-swipe-trail dash-swipe-trail-left"></span>
        <span class="dash-swipe-trail dash-swipe-trail-right"></span>
        <svg class="dash-swipe-hand" viewBox="0 0 13 17" width="26" height="34" shape-rendering="crispEdges">
          <path fill="#002855" d="M3 0h5v10H3zM6 5h7v6H6zM0 7h5v5H0zM1 8h12v7H1zM2 15h10v2H2z"/>
          <path fill="#FFF" d="M4 1h3v9H4zM7 6h5v4H7zM1 8h3v3H1zM2 9h10v5H2zM3 14h8v2H3z"/>
          <path fill="#002855" d="M9 6h1v3H9z"/>
        </svg>
        <svg class="dash-swipe-chevron dash-swipe-chevron-right" viewBox="0 0 16 12" width="20" height="15"><path d="M2 1l5 5-5 5M9 1l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <span class="dash-swipe-label">SWIPE TO STEER</span>
    </div>
    <div class="dash-overlay" data-overlay>
      <div class="dash-overlay-card" data-main-card>
        <span class="dash-eyebrow" data-eyebrow hidden></span>
        <h2 data-overlay-title>Delivery Dash</h2>
        <p data-overlay-message>Dodge the roadworks. Collect the gifts.</p>
        <form class="dash-submit" data-submit hidden>
          <input type="text" data-nickname maxlength="16" placeholder="Nickname for the leaderboard" autocomplete="nickname" aria-label="Nickname for the leaderboard" />
          <button type="submit" data-submit-button>Submit</button>
        </form>
        <p class="dash-board-note" data-board-note role="status" hidden></p>
        <div class="dash-rewards" data-rewards hidden></div>
        <div class="dash-actions">
          <button class="dash-start" type="button" data-action="start" disabled>Start driving</button>
          <button class="dash-start" type="button" data-action="leave-shop" hidden>Back on the road</button>
          <button class="dash-secondary" type="button" data-action="open-board">Leaderboard</button>
        </div>
        <p class="dash-howto" data-howto>
          <span class="dash-howto-keys">← → steer · ↑ boost</span>
          <span class="dash-howto-touch">Swipe to steer · hold BOOST</span>
        </p>
      </div>
      <div class="dash-overlay-card dash-board-card" data-board-card hidden>
        <h2>Leaderboard</h2>
        <div class="dash-board-tabs" role="tablist" aria-label="Leaderboard version">
          <button type="button" role="tab" data-board-tab="v02" aria-selected="true">v0.2 · Score</button>
          <button type="button" role="tab" data-board-tab="v01" aria-selected="false">v0.1 · Hall of Fame</button>
        </div>
        <input class="dash-board-search" type="search" data-board-search maxlength="16" placeholder="Search names" autocomplete="off" spellcheck="false" aria-label="Search leaderboard names" />
        <p class="dash-board-note" data-board-result role="status" hidden></p>
        <ol class="dash-board" data-board-list></ol>
        <p class="dash-board-empty" data-board-empty></p>
        <button class="dash-start" type="button" data-action="close-board">Back</button>
      </div>
    </div>
  </div>
  <footer class="dash-controls">
    <button class="dash-boost" type="button" data-action="boost" aria-label="Boost. Hold to go faster" disabled>
      <span class="dash-boost-fill" data-boost-fill></span>
      <span class="dash-boost-label" data-boost-label>BOOST</span>
    </button>
  </footer>
  <span class="dash-sr-only" role="status" aria-live="polite" data-live-status></span>
</section>

</div>
<style>

.delivery-dash, .delivery-dash * { box-sizing: border-box; }
.delivery-dash { width: 100%; max-width: 480px; margin-inline: auto; overflow: hidden; border-radius: 14px; background: #002855; color: #fff; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.delivery-dash button { font: inherit; cursor: pointer; }
.delivery-dash button:focus-visible { outline: 3px solid #FFC35B; outline-offset: -3px; }
.delivery-dash button:disabled { cursor: default; opacity: 0.45; }
.delivery-dash [hidden] { display: none !important; } 

.dash-header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
.dash-header img { display: block; object-fit: contain; }
.dash-version { align-self: flex-end; margin-left: -2px; font-size: 10px; line-height: 1; opacity: 0.55; }
.dash-header-first { margin-left: auto; }
.dash-icon-button { display: grid; place-items: center; width: 36px; height: 36px; padding: 0; background: #123C68; border: 0; border-radius: 8px; color: #FFF; }

.dash-scene { position: relative; width: 100%; min-height: 340px; overflow: hidden; background: #002855; }
.dash-scene canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; touch-action: pan-y; }
.dash-truck-logo { position: absolute; display: block; height: auto; image-rendering: auto; max-width: none; pointer-events: none; visibility: hidden; }
.delivery-dash[data-state="running"] .dash-scene { min-height: 0; }

.dash-hud { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; pointer-events: none; }
.delivery-dash[data-state="ready"] .dash-hud { visibility: hidden; }
.dash-pill { display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px; border-radius: 999px; background: #002855D9; color: #FFF; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
.dash-pill small { font-size: 11px; font-weight: 600; color: #AEC3DC; }
.dash-pill-points { color: #FFC35B; align-self: flex-start; }
.dash-score { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.dash-mult { margin-left: 2px; color: #FFC35B; font-size: 14px; font-weight: 800; transition: color 0.2s, text-shadow 0.2s; }
.dash-mult:is([data-tier="2"], [data-tier="3"]) { color: #FFB21E; text-shadow: 0 0 6px #ED8B00; }
.dash-mult:is([data-tier="4"], [data-tier="5"]) { color: #FF9A2E; font-size: 15px; text-shadow: 0 0 8px #FF6A00, 0 0 14px #ED8B0099; }
.dash-mult:is([data-tier="6"], [data-tier="7"], [data-tier="8"]) { color: #FFF2B8; font-size: 16px; text-shadow: 0 0 8px #FFC35B, 0 0 16px #FF6A00; animation: dash-mult-fire 0.8s ease-in-out infinite alternate; }
.dash-score[data-flash="up"] .dash-pill { animation: dash-pill-up 0.9s ease-out; }
.dash-score[data-flash="up"] .dash-mult { animation: dash-mult-pop 0.9s ease-out; }
.dash-score[data-flash="up"] .dash-chain span { background: #FFF2B8; box-shadow: 0 0 8px #FFC35B; }
.dash-score[data-flash="lost"] .dash-pill { animation: dash-pill-lost 0.9s ease-out; }
.dash-score[data-flash="lost"] .dash-mult { color: #FF5A4D; text-shadow: 0 0 6px #FF2A1A; }
.dash-score[data-flash="lost"] .dash-chain span { background: #FF5A4D; }
@keyframes dash-mult-fire { to { transform: scale(1.12); } }
@keyframes dash-mult-pop { 0% { transform: scale(2.2); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }
@keyframes dash-pill-up { 0% { box-shadow: 0 0 0 0 #FFC35BCC; } 35% { box-shadow: 0 0 0 5px #FFC35B88, 0 0 18px #ED8B00; } 100% { box-shadow: 0 0 0 0 #FFC35B00; } }
@keyframes dash-pill-lost {
  0% { transform: none; box-shadow: 0 0 0 4px #FF3B2AAA, 0 0 14px #FF3B2A; }
  15% { transform: translateX(-4px); }
  30% { transform: translateX(4px); }
  45% { transform: translateX(-3px); }
  60% { transform: translateX(3px); }
  100% { transform: none; box-shadow: 0 0 0 0 #FF3B2A00; }
}
.dash-chain { display: block; width: 100%; height: 3px; overflow: hidden; border-radius: 2px; background: #FFFFFF33; }
.dash-chain span { display: block; width: 0; height: 100%; background: #FFC35B; transition: width 0.15s linear; }
.dash-delivery { position: absolute; top: 46px; right: 10px; min-width: 128px; max-width: 55%; padding: 6px 10px 8px; border-radius: 10px; background: #002855D9; color: #FFF; font-size: 12px; font-weight: 750; letter-spacing: 0.4px; text-align: center; font-variant-numeric: tabular-nums; pointer-events: none; }
.dash-delivery[data-phase="incoming"] { color: #BFE8CE; }
.dash-delivery-bar { display: block; height: 4px; margin-top: 5px; overflow: hidden; border-radius: 2px; background: #FFFFFF33; }
.dash-delivery-bar span { display: block; width: 100%; height: 100%; background: #4CC380; }
.dash-delivery[data-urgent="true"] .dash-delivery-bar span { background: #FF6A4D; }
.dash-perks { position: absolute; top: 52px; left: 10px; display: flex; flex-wrap: wrap; gap: 4px; max-width: 70%; pointer-events: none; }
.dash-perks span { padding: 3px 8px; border-radius: 999px; background: #002855D9; color: #FFCF80; font-size: 11px; font-weight: 650; }
.dash-toast { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); padding: 5px 12px; border-radius: 999px; background: #ED8B00; color: #0A1D40; font-weight: 750; font-size: 12px; white-space: nowrap; pointer-events: none; }
.dash-snappy { position: absolute; top: 34%; left: 50%; display: flex; flex-direction: column; align-items: center; gap: 4px; transform: translate(-50%, -50%) rotate(-7deg); color: #FFF; font-style: italic; line-height: 1; pointer-events: none; animation: dash-snappy-pop 1.3s ease-out forwards; }
.dash-snappy-word { font-size: 42px; font-weight: 900; letter-spacing: 1px; text-decoration: line-through; text-decoration-color: #ED8B00; text-decoration-thickness: 6px; text-shadow: 0 3px 0 #002855, 0 0 12px #3C9FE4; }
.dash-snappy-points { font-size: 30px; font-weight: 900; color: #FFE08A; text-shadow: 0 3px 0 #002855, 0 0 10px #ED8B00; }
.dash-streak-call { position: absolute; top: 82px; left: 10px; transform-origin: left center; color: #FFE08A; font-size: 22px; font-weight: 900; font-style: italic; letter-spacing: 0.5px; line-height: 1; text-shadow: 0 2px 0 #002855, 0 0 10px #ED8B00; pointer-events: none; animation: dash-streak-up 1.3s ease-out forwards; }
.dash-streak-call[data-kind="lost"] { color: #FF5A4D; text-shadow: 0 2px 0 #002855, 0 0 10px #FF2A1A; animation-name: dash-streak-lost; }
@keyframes dash-streak-up {
  0% { opacity: 0; transform: scale(0.4); }
  20% { opacity: 1; transform: scale(1.25); }
  35% { transform: scale(1); }
  75% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-14px); }
}
@keyframes dash-streak-lost {
  0% { opacity: 0; transform: scale(1.6); }
  15% { opacity: 1; transform: scale(1) translateX(-5px); }
  25% { transform: translateX(5px); }
  35% { transform: translateX(-3px); }
  45% { transform: none; }
  75% { opacity: 1; }
  100% { opacity: 0; transform: translateY(10px); }
}
@keyframes dash-snappy-pop {
  0% { opacity: 0; transform: translate(-50%, -50%) rotate(-7deg) scale(0.3); }
  18% { opacity: 1; transform: translate(-50%, -50%) rotate(-7deg) scale(1.15); }
  30% { transform: translate(-50%, -50%) rotate(-7deg) scale(1); }
  75% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -70%) rotate(-7deg) scale(1); }
}
@media (prefers-reduced-motion: reduce) {
  .dash-snappy, .dash-streak-call, .dash-mult, .dash-score .dash-pill { animation: none !important; }
}

.dash-swipe-hint { position: absolute; top: 30%; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; animation: dash-swipe-in 0.3s ease-out; }
.dash-swipe-track { position: relative; width: 156px; height: 40px; }
.dash-swipe-hand { position: absolute; top: 2px; left: calc(50% - 11px); filter: drop-shadow(0 2px 0 #00285599); animation: dash-swipe-hand 2.4s ease-in-out infinite; }
.dash-swipe-chevron { position: absolute; top: 0; color: #FFC35B; filter: drop-shadow(0 1px 0 #002855); opacity: 0.45; }
.dash-swipe-chevron-left { left: 0; animation: dash-swipe-left 2.4s ease-in-out infinite; }
.dash-swipe-chevron-right { right: 0; animation: dash-swipe-right 2.4s ease-in-out infinite; }
.dash-swipe-trail { position: absolute; top: 5px; width: 46px; height: 4px; border-radius: 2px; transform: scaleX(0); }
.dash-swipe-trail-left { right: 50%; transform-origin: right; background: linear-gradient(270deg, #FFFFFFCC, #FFFFFF00); animation: dash-swipe-trail-left 2.4s ease-in-out infinite; }
.dash-swipe-trail-right { left: 50%; transform-origin: left; background: linear-gradient(90deg, #FFFFFFCC, #FFFFFF00); animation: dash-swipe-trail-right 2.4s ease-in-out infinite; }
.dash-swipe-label { padding: 4px 10px; border-radius: 999px; background: #002855D9; color: #FFF; font-size: 11px; font-weight: 800; letter-spacing: 2px; white-space: nowrap; }
@keyframes dash-swipe-in { from { opacity: 0; transform: translate(-50%, 6px); } }
@keyframes dash-swipe-hand {
  0% { transform: translateX(0) scale(1.15); opacity: 0; }
  8% { transform: translateX(0) scale(1); opacity: 1; }
  34% { transform: translateX(-46px) scale(1); opacity: 1; }
  44%, 50% { transform: translateX(-46px) scale(1.15); opacity: 0; }
  51% { transform: translateX(0) scale(1.15); opacity: 0; }
  58% { transform: translateX(0) scale(1); opacity: 1; }
  84% { transform: translateX(46px) scale(1); opacity: 1; }
  94%, 100% { transform: translateX(46px) scale(1.15); opacity: 0; }
}
@keyframes dash-swipe-trail-left { 0%, 8% { transform: scaleX(0); opacity: 1; } 34% { transform: scaleX(1); opacity: 1; } 44%, 100% { transform: scaleX(1); opacity: 0; } }
@keyframes dash-swipe-trail-right { 0%, 58% { transform: scaleX(0); opacity: 1; } 84% { transform: scaleX(1); opacity: 1; } 94%, 100% { transform: scaleX(1); opacity: 0; } }
@keyframes dash-swipe-left { 0%, 8% { opacity: 0.45; transform: none; } 26%, 40% { opacity: 1; transform: translateX(-3px); } 50%, 100% { opacity: 0.45; transform: none; } }
@keyframes dash-swipe-right { 0%, 58% { opacity: 0.45; transform: none; } 76%, 90% { opacity: 1; transform: translateX(3px); } 100% { opacity: 0.45; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .dash-swipe-hint, .dash-swipe-hand, .dash-swipe-chevron { animation: none; }
  .dash-swipe-chevron { opacity: 1; }
  .dash-swipe-trail { display: none; }
}

.dash-overlay { position: absolute; inset: 0; display: flex; padding: 12px; overflow-y: auto; background: #002855AA; }
.dash-overlay-card { width: 100%; max-width: 340px; margin: auto; background: #FFF; color: #002855; text-align: center; padding: 22px 18px; border-radius: 14px; box-shadow: 0 8px 28px #00285540; }
.dash-eyebrow { display: block; color: #7A6650; font-size: 10px; font-weight: 650; letter-spacing: 1.8px; }
.dash-overlay h2 { margin: 0 0 6px; font-size: 26px; line-height: 1.15; font-weight: 800; letter-spacing: -0.5px; }
.dash-overlay p { margin: 0 0 14px; font-size: 13px; line-height: 1.5; color: #55647A; }
.dash-overlay p:empty { display: none; }
.dash-actions { display: grid; gap: 8px; }
.dash-start, .dash-secondary { min-height: 46px; padding: 10px 22px; border-radius: 9px; font-weight: 750 !important; font-size: 14px !important; }
.dash-start { border: 0; background: #ED8B00; color: #0A1D40; }
.dash-start:hover { background: #F5A21A; }
.dash-secondary { background: transparent; border: 2px solid #D5DEEA; color: #002855; }
.dash-secondary:hover { border-color: #002855; }
.dash-howto { margin: 14px 0 0 !important; font-size: 11px !important; color: #7A8AA0 !important; }
.dash-howto-touch { display: none; }
.dash-touch .dash-howto-keys { display: none; } .dash-touch .dash-howto-touch { display: inline; }
.delivery-dash:not([data-state="ready"]) .dash-howto { display: none; }

.dash-submit { display: flex; gap: 6px; margin: 0 0 12px; }
.dash-submit input { flex: 1; min-width: 0; min-height: 44px; padding: 0 10px; border: 1px solid #B9C7D8; border-radius: 8px; font: inherit; font-size: 16px; color: #002855; background: #FFF; }
.dash-submit input:focus-visible { outline: 3px solid #FFC35B; outline-offset: 0; }
.dash-submit button { min-height: 44px; padding: 0 16px; border: 0; border-radius: 8px; background: #002855; color: #FFF; font-weight: 700; font-size: 13px; }
.dash-board-note { margin: 0 0 12px !important; font-size: 13px !important; font-weight: 700; color: #B05F00 !important; }

.dash-board-card { display: flex; flex-direction: column; max-height: 100%; }
.dash-board-card h2 { margin-bottom: 10px; }
.dash-board { flex: 1; min-height: 0; margin: 0 0 12px; padding: 0; overflow-y: auto; overscroll-behavior: contain; list-style: none; text-align: left; }
.dash-board li { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 7px; font-size: 14px; font-variant-numeric: tabular-nums; }
.dash-board li:nth-child(odd) { background: #F4F6FB; }
.dash-board li.dash-board-you { background: #FFE9C2; font-weight: 700; }
.dash-board-rank { flex-shrink: 0; min-width: 3ch; color: #ED8B00; font-weight: 800; }
.dash-board-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dash-board-value { color: #55647A; }
.dash-board-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
.dash-board-tabs button { flex: 1; padding: 7px 6px; border: 1px solid #C9D3E3; border-radius: 8px; background: #FFF; color: #55647A; font-size: 12px; font-weight: 700; }
.dash-board-tabs button[aria-selected="true"] { border-color: #ED8B00; background: #FFF2D9; color: #002855; }
.dash-board-empty { margin-bottom: 12px !important; }
.dash-board-search { width: 100%; min-height: 40px; margin-bottom: 10px; padding: 0 10px; border: 1px solid #B9C7D8; border-radius: 8px; font: inherit; font-size: 16px; color: #002855; background: #FFF; }
.dash-board-search:focus-visible { outline: 3px solid #FFC35B; outline-offset: 0; }
.delivery-dash[data-board-open="true"] .dash-scene { min-height: 540px; }

.dash-controls { display: flex; align-items: stretch; gap: 10px; padding: 10px 12px 12px; }
.dash-boost { position: relative; flex: 1; overflow: hidden; min-height: 48px; padding: 0 10px; border: 1px solid #FFC35B; border-radius: 10px; background: #123C68; color: #FFF; font-weight: 800 !important; font-size: 14px !important; letter-spacing: 3px; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.dash-boost-fill { position: absolute; inset: 0 auto 0 0; width: var(--boost-fill, 100%); background: linear-gradient(90deg, #ED8B00, #FFC35B); transition: width 0.1s linear; }
.dash-boost:disabled .dash-boost-fill { background: #2F5683; }
.dash-boost-label { position: relative; text-shadow: 0 1px 2px #00285599; }
.dash-boost[data-active="true"] { box-shadow: 0 0 0 3px #FFC35B88, 0 0 18px #ED8B00; }
.dash-boost[data-locked="true"] { border-color: #6B7C93; letter-spacing: 1.5px; font-size: 12px !important; }
.dash-boost[data-locked="true"] .dash-boost-fill { background: #6B7C93; }
.dash-sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.dash-rewards { display: grid; gap: 8px; margin: 12px 0; text-align: left; }
.dash-rewards button { --accent: #ED8B00; position: relative; display: flex; align-items: center; gap: 12px; padding: 9px 12px 9px 9px; min-height: 56px; text-align: left; color: #FFF; background: linear-gradient(100deg, #0B3A6B, #123C68); border: 1px solid #41638A; border-left: 4px solid var(--accent); border-radius: 10px; transition: transform 0.12s, box-shadow 0.12s; }
.dash-rewards button:not(:disabled):hover, .dash-rewards button:not(:disabled):focus-visible { transform: translateY(-1px); box-shadow: 0 0 0 2px var(--accent), 0 6px 14px #00285540; }
.dash-rewards button:not(:disabled):active { transform: scale(0.98); }
.dash-rewards button:disabled { filter: grayscale(0.7); }
.dash-rewards svg { flex-shrink: 0; width: 34px; height: 34px; padding: 5px; border-radius: 50%; background: var(--accent); color: #FFF; }
.dash-reward-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.dash-rewards strong { font-size: 13px; letter-spacing: 0.2px; }
.dash-reward-text span { font-size: 11px; line-height: 1.35; color: #C6D5E8; }
.dash-reward-cost { margin-left: auto; padding-left: 8px; font-style: normal; font-weight: 750; font-size: 12px; color: #FFC35B; font-variant-numeric: tabular-nums; white-space: nowrap; }

.delivery-dash:is([data-state="reward"], [data-state="shop"]) .dash-overlay { background: radial-gradient(circle at 50% 30%, #FFC35B55, #002855DD 80%); }
.delivery-dash:is([data-state="reward"], [data-state="shop"]) .dash-overlay-card { background: #002855; color: #FFF; border: 2px dashed #FFC35B; box-shadow: 0 0 0 4px #002855, 0 0 28px #ED8B0088; padding: 16px; }
.delivery-dash:is([data-state="reward"], [data-state="shop"]) .dash-eyebrow { color: #FFC35B; }
.delivery-dash:is([data-state="reward"], [data-state="shop"]) .dash-overlay h2 { font-size: 34px; letter-spacing: 6px; margin: 4px 0; color: #FFC35B; text-shadow: 0 2px 0 #B05F00; }
.delivery-dash:is([data-state="reward"], [data-state="shop"]) .dash-overlay p { color: #C6D5E8; }
.delivery-dash:is([data-state="reward"], [data-state="shop"]) [data-action="open-board"] { display: none; }
.delivery-dash[data-state="shop"] .dash-scene { min-height: 480px; }

.delivery-dash.dash-fullscreen { position: fixed; inset: 0; z-index: 2147483000; width: 100vw; height: 100vh; height: 100dvh; max-width: none; border-radius: 0; display: flex; flex-direction: column; justify-content: space-between; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
.dash-fullscreen .dash-scene { flex: 1 1 0; width: 100%; min-height: 0 !important; margin-inline: auto; align-self: center; }
.dash-fullscreen .dash-header, .dash-fullscreen .dash-controls { width: min(100%, 640px); margin-inline: auto; }
.dash-fullscreen[data-state="running"], .dash-fullscreen[data-state="running"] canvas { touch-action: none; overscroll-behavior: none; }
@media (max-height: 700px) {
  .dash-fullscreen .dash-overlay { padding: 8px; }
  .dash-fullscreen .dash-overlay-card { padding: 12px; }
  .dash-fullscreen:is([data-state="reward"], [data-state="shop"]) .dash-overlay h2 { font-size: 26px; letter-spacing: 4px; margin: 2px 0; }
  .dash-fullscreen .dash-overlay p { margin-bottom: 8px; }
  .dash-fullscreen .dash-rewards { gap: 6px; margin: 8px 0; }
  .dash-fullscreen .dash-rewards button { min-height: 46px; padding-block: 6px; }
}
@media (orientation: landscape) and (max-height: 520px) {
  .dash-fullscreen .dash-header { padding: 4px 14px; }
  .dash-fullscreen .dash-controls { padding: 4px 12px 6px; }
  .dash-fullscreen .dash-boost { min-height: 40px; }
  .dash-fullscreen .dash-overlay-card { padding: 12px; }
  .dash-fullscreen .dash-overlay h2 { font-size: 20px; margin-bottom: 4px; }
  .dash-fullscreen .dash-overlay p { margin-bottom: 8px; }
  .dash-fullscreen .dash-howto { display: none; }
  .dash-fullscreen .dash-rewards button { min-height: 40px; }
}
@media (max-width: 380px) {
  .dash-overlay-card { padding: 16px 14px; }
  .dash-overlay h2 { font-size: 23px; }
  .dash-boost { letter-spacing: 2px; }
}

</style>

/**
 * Speed in world units per second after t seconds driven: it climbs quickly to about 3× the starting pace in the
 * first minute, then creeps up for the rest of the run with no ceiling. Rows are spaced in seconds, so speed
 * sets how the game looks and scores; how hard it is to react comes from ROW_GAPS and DIFFICULTY_FROM below.
 */
const SPEED_START = 107.5;
const SPEED_RISE = 300;
const SPEED_RISE_SECONDS = 60;
const SPEED_CREEP = 0.75;
const speedAt = (seconds) => SPEED_START + SPEED_RISE * (1 - Math.exp(-seconds / SPEED_RISE_SECONDS)) + SPEED_CREEP * seconds;
/** Distance covered in `seconds` of driving: the integral of `speedAt`. */
const distanceAt = (seconds) => SPEED_START * seconds + SPEED_RISE * (seconds - SPEED_RISE_SECONDS * (1 - Math.exp(-seconds / SPEED_RISE_SECONDS))) + SPEED_CREEP / 2 * seconds * seconds;
/**
 * Seconds between rows at the given time into the run, linearly between these points and flat after the last.
 * Easy to react to for the first 5 minutes, actively hard from 5 to 10, and from 10 minutes on it stays at 0.55s: a
 * two-lane jump takes 0.32s to cross, so that leaves about 200ms to spot it and press, which is already a very good
 * player's margin with nothing left over for fatigue or a slip.
 */
const ROW_GAPS = [[0, 1.6], [60, 1.4], [150, 1.2], [300, 0.95], [600, 0.55]];
const rowGapAt = (seconds) => {
    const next = ROW_GAPS.findIndex(([time]) => time > seconds);
    if (next === -1)
        return ROW_GAPS[ROW_GAPS.length - 1][1];
    const [fromTime, fromGap] = ROW_GAPS[next - 1], [toTime, toGap] = ROW_GAPS[next];
    return fromGap + (toGap - fromGap) * (seconds - fromTime) / (toTime - fromTime);
};

const DIFFICULTY_FULL = 600;
/** 0 until DIFFICULTY_FROM, then rising to 1 at DIFFICULTY_FULL; scales how often the harder patterns and traps appear. */
const difficultyAt = (seconds) => Math.max(0, Math.min(1, (seconds - DIFFICULTY_FROM) / (DIFFICULTY_FULL - DIFFICULTY_FROM)));
const blend = (easy, hard, seconds) => easy + (hard - easy) * difficultyAt(seconds);

        const body = this.scenery['giftasaurusBody'], extension = this.engine.biteExtension(e);
        const head = this.scenery[this.engine.biteStage(e) === 'lean' ? 'giftasaurusOpen' : 'giftasaurusClosed'];
        const p = this.project(0, e.z), s = p.scale, c = this.ctx, calm = this.motion.matches;
        if (!body || !head || this.pastBottom(p.y))
            return;
        const { bodyTilt, headTurn, unit, pivot } = this.giftasaurusPose(extension);
        // Bobblehead: the head nods on its neck while it waits, and holds still while biting.
        const nod = calm ? 0 : Math.sin(this.engine.elapsed * 7 + e.id) * 0.08 * (1 - extension);
        c.save();
        c.translate(Math.round(p.x), Math.round(p.y));
        if (e.lane === 2)
            c.scale(-1, 1);
        c.fillStyle = '#34424C';
        c.fillRect(Math.round((pivot - 16 * unit) * s), Math.round(-2 * s), Math.round(30 * unit * s), Math.max(1, Math.round(3 * s)));
        c.translate(pivot * s, 0);
        c.rotate(bodyTilt);
        c.scale(unit * s, unit * s);
        c.drawImage(body, -24, -48);
        c.translate(8.5, -40);
        c.rotate(headTurn + nod);
        c.translate(-8.5, 40);
        c.drawImage(head, 2, -71);
        c.restore();
    }
    /**
     * The crane stands on a verge, left-hand facing the road and mirrored for the right, with its boom reaching over
     * the middle of the road. The ball hangs from the cable stub on a chain and swings about it; a shadow on the road
     * shows where it is. The chain angle comes from the engine's ball position so what is drawn is what hits the truck.
     */
    crane(e) {
        const body = this.scenery['craneBody'], ball = this.scenery['craneBall'];
        const p = this.project(0, e.z), c = this.ctx;
        if (!body || !ball || this.pastBottom(p.y) || p.scale > 2)
            return;
        const ballLane = this.engine.craneBall(e), lateral = (ballLane - 1) * LANE_WIDTH;
        const angle = Math.asin(Math.max(-1, Math.min(1, lateral / CRANE_CHAIN)));
        const height = (body.naturalHeight - CRANE_PIVOT.y) * CRANE_UNIT, swing = CRANE_CHAIN * Math.cos(angle);
        c.save();
        c.translate(Math.round(p.x), Math.round(p.y));
        c.scale(p.scale, p.scale);
        c.save();
        if (e.lane === 2)
            c.scale(-1, 1);
        c.drawImage(body, -CRANE_PIVOT.x * CRANE_UNIT, -body.naturalHeight * CRANE_UNIT, body.naturalWidth * CRANE_UNIT, body.naturalHeight * CRANE_UNIT);
        c.restore();
        const low = Math.max(0, Math.min(1, (height - swing) / 40));
        c.globalAlpha = 0.18 + 0.12 * low;
        c.fillStyle = '#0E1B2A';
        c.beginPath();
        c.ellipse(lateral, 0, 15 + 4 * low, 4 + low, 0, 0, Math.PI * 2);
        c.fill();
        c.globalAlpha = 1;
        c.translate(0, -height);
        c.rotate(-angle);
        const linkTop = CRANE_CHAIN - CRANE_BALL_CENTRE.y * CRANE_BALL_UNIT;
        for (let link = 0; link * 5 < linkTop; link++) {
            c.fillStyle = link % 2 ? '#3E4F60' : '#9DB0C1';
            c.fillRect(-2, link * 5, 4, 5);
        }
        c.drawImage(ball, -CRANE_BALL_CENTRE.x * CRANE_BALL_UNIT, linkTop, ball.naturalWidth * CRANE_BALL_UNIT, ball.naturalHeight * CRANE_BALL_UNIT);
        c.restore();
    }
    /** Body tilt and head turn that put the jaw tip `extension` of the bite reach past the road edge. */
    giftasaurusPose(extension) {
        const degrees = Math.PI / 180, socket = [8.5, -40], jaw = [32.5, -20];
        const turn = (angle, [x, y]) => [x * Math.cos(angle) - y * Math.sin(angle), x * Math.sin(angle) + y * Math.cos(angle)];
        const pose = (amount) => ({ bodyTilt: (-6 + 30 * amount) * degrees, headTurn: (-10 + 40 * amount) * degrees });
        const tipAt = (amount) => {
            const { bodyTilt, headTurn } = pose(amount), [jx, jy] = turn(headTurn, jaw);
            return turn(bodyTilt, [socket[0] + jx, socket[1] + jy])[0];
        };
        const rest = tipAt(0), unit = BITE_REACH * (260 / 3) / (tipAt(1) - rest), target = rest + extension * (tipAt(1) - rest);
        let low = 0, high = 1;
        for (let step = 0; step < 18; step++) {
            const middle = (low + high) / 2;
            if (tipAt(middle) < target)
                low = middle;
            else
                high = middle;
        }
        return { ...pose((low + high) / 2), unit, pivot: -130 - rest * unit };
    }
    truckLean() {
        return this.truckHeading;
    }
    drawTruck() {
        if (!this.truck)
            return;
        const e = this.engine, p = this.project((e.visualLane - 1) * (260 / 3), 20);
        const width = 48, height = 73;
        const moving = e.state === 'running' || (e.state === 'ready' && !this.motion.matches);
        const bounce = moving && !this.motion.matches ? Math.round(Math.sin((e.elapsed + this.idleTime / 18) * 13) * 0.6) : 0;
        const left = Math.round(p.x - width / 2), top = Math.round(p.y - height + bounce);
        this.rect('#334350', left - 2, p.y - 3, width + 4, 5);
        if (moving && !this.motion.matches) {
            const time = e.elapsed + this.idleTime / 18;
            for (let i = 0; i < 4; i++) {
                const age = (time * 1.7 + i * 0.24) % 1;
                this.ctx.globalAlpha = (1 - age) * 0.32;
                this.rect('#C8D0CC', left + 4 - age * 4, p.y + 1 + age * 17, 3 + age * 5, 2 + age * 4);
            }
            this.ctx.globalAlpha = 1;
        }
        const ghost = e.ghostUntil > e.elapsed;
        const flicker = ghost && !this.motion.matches ? 0.45 + 0.15 * Math.sin(e.elapsed * 30) : ghost ? 0.5 : 1;
        this.ctx.globalAlpha = flicker;
        if (e.boostLevel > 0.1) {
            const flicker = 0.75 + 0.25 * Math.sin(e.elapsed * 60);
            for (const x of [left + 7, left + width - 13]) {
                const length = Math.round((6 + 12 * e.boostLevel) * flicker);
                this.rect('#ED8B00', x, top + height - 2, 6, length);
                this.rect('#FFE08A', x + 1, top + height - 2, 4, Math.round(length * 0.65));
                this.rect('#FFFFFF', x + 2, top + height - 2, 2, Math.round(length * 0.35));
            }
        }
        const lean = this.truckLean(), sourceHeight = this.truck.naturalHeight, rowHeight = Math.max(1, Math.round(sourceHeight / height));
        for (let row = 0; row < height; row++) {
            this.ctx.drawImage(this.truck, 0, Math.min(sourceHeight - rowHeight, Math.floor(row * sourceHeight / height)), this.truck.naturalWidth, rowHeight, left + Math.round(lean * (height - row)), top + row, width, 1);
        }
        this.ctx.globalAlpha = 1;
        this.logo.style.opacity = String(flicker);
        const calm = this.motion.matches, time = e.elapsed;
        if (e.shields > 0 || e.invulnerableUntil > e.elapsed) {
            this.ctx.globalAlpha = 0.14 + 0.04 * e.shields;
            this.ctx.fillStyle = '#8ED5DD';
            this.ctx.beginPath();
            this.ctx.ellipse(p.x, top + 38, 32, 44, 0, 0, Math.PI * 2);
            this.ctx.fill();
            this.ctx.globalAlpha = 1;
            for (let i = 0; i < 18; i++) {
                const angle = i * Math.PI * 2 / 18;
                this.rect(i % 3 ? '#8ED5DD' : '#D7F6EE', p.x + Math.cos(angle) * 29, top + 37 + Math.sin(angle) * 42, 2, 2);
            }
            for (let i = 0; i < e.shields; i++)
                this.rect('#D7F6EE', p.x - 8 + i * 8, top - 6, 5, 5);
        }
        if (e.magnet && !calm) {
            for (let i = 0; i < 14; i++) {
                const angle = time * 3 + i * Math.PI * 2 / 14, reach = 58 + 4 * Math.sin(time * 4 + i);
                this.rect(i % 2 ? '#FF6A4D' : '#FFD1C8', p.x + Math.cos(angle) * reach, top + 60 + Math.sin(angle) * 16, 3, 3);
            }
        }
        if (e.jackpotUntil > time && !calm) {
            for (let i = 0; i < 10; i++) {
                const age = (time * 1.8 + i * 0.37) % 1;
                this.rect(i % 2 ? '#C58BFF' : '#FFE08A', p.x - 24 + ((i * 17) % 48), top + 66 - age * 70, 3, 3);
            }
        }
        if (ghost && !calm)
            for (let i = 0; i < 6; i++) {
                const age = (time * 1.4 + i * 0.17) % 1;
                this.rect('#BFD0FF', p.x - 20 + ((i * 13) % 40), top + 70 + age * 20, 3, 4);
            }
        const pickupAge = e.elapsed - e.lastPickupAt;
        if (!this.motion.matches && pickupAge >= 0 && pickupAge < 0.4) {
            for (let i = 0; i < 8; i++) {
                const angle = i * Math.PI / 4, radius = 12 + pickupAge * 65;
                this.rect(i % 2 ? '#ED8B00' : '#FFE2A6', p.x + Math.cos(angle) * radius, top + 12 + Math.sin(angle) * radius * 0.5 - pickupAge * 25, 2, 2);
            }
        }
        if (moving) {
            const tread = Math.floor((e.distance + this.idleTime) * 0.7) % 3;
            this.rect('#596273', left + 4, top + height - 3 + tread, 4, 1);
            this.rect('#596273', left + width - 8, top + height - 3 + tread, 4, 1);
        }
        const s = this.displayScale;
        this.logo.style.left = `${(left + 7 + Math.round(lean * 30)) * s}px`;
        this.logo.style.top = `${(top + 34) * s}px`;
        this.logo.style.width = `${34 * s}px`;
        this.logo.style.visibility = 'visible';
    }
    destroy() {
        if (this.destroyed)
            return;
        this.destroyed = true;
        if (this.frame)
            this.win.cancelAnimationFrame(this.frame);
        this.frame = 0;
        this.abort.abort();
        this.win.clearTimeout(this.searchTimer);
        this.observer.disconnect();
        this.intersection.disconnect();
    }
}

const root=document.getElementById("giftgo-delivery-dash-preview").querySelector(".delivery-dash");
const game=new DeliveryDashGame(root,window);
root.deliveryDash=game;
window.addEventListener("pagehide",()=>game.destroy(),{once:true});
})();
</script>
