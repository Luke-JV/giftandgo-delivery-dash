<section class="delivery-dash" tabindex="-1" aria-label="Gift and Go Delivery Dash driving game">
  <header class="dash-header">
    <img data-brand-logo width="88" height="21" alt="Gift&amp;Go" />
    <small class="dash-version">v0.2</small>
    <div class="dash-volume dash-header-first">
      <button class="dash-icon-button" type="button" data-action="volume" aria-label="Volume" aria-expanded="false">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M1 5.5h3L8 2v12l-4-3.5H1z" fill="currentColor"/><path data-volume-waves d="M10.5 5.5a3.5 3.5 0 010 5M12.5 3.5a6.5 6.5 0 010 9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <div class="dash-volume-panel" data-volume-panel hidden>
        <span aria-hidden="true">Music</span>
        <input type="range" min="0" max="100" step="5" value="40" data-volume aria-label="Music volume" />
        <output data-volume-value>40%</output>
        <span aria-hidden="true">Effects</span>
        <input type="range" min="0" max="100" step="5" value="50" data-sfx-volume aria-label="Sound effects volume" />
        <output data-sfx-volume-value>50%</output>
        <span class="dash-thumb-setting" aria-hidden="true">Boost</span>
        <div class="dash-thumb-setting dash-thumb-toggle" role="radiogroup" aria-label="Boost button side">
          <button type="button" role="radio" data-thumb="left" aria-checked="false">Left</button>
          <button type="button" role="radio" data-thumb="right" aria-checked="true">Right</button>
        </div>
      </div>
    </div>
    <button class="dash-icon-button" type="button" data-action="fullscreen" aria-label="Enter fullscreen" aria-pressed="false">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" data-fullscreen-icon><path d="M1 6V1h5M10 1h5v5M15 10v5h-5M6 15H1v-5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    </button>
    <button class="dash-icon-button" type="button" data-action="pause" aria-label="Pause" disabled>
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path data-pause-icon d="M3.5 2h3v12h-3zM9.5 2h3v12h-3z" fill="currentColor"/></svg>
    </button>
  </header>
  <div class="dash-scene" data-scene>
    <canvas data-game-canvas width="240" height="230" aria-label="Three-lane road. Steer left and right to dodge cones, barriers, traffic drums and potholes. Collect gifts, and grab the rare golden coupon, as the pace increases."></canvas>
    <img class="dash-truck-logo" data-truck-logo alt="" aria-hidden="true" />
    <div class="dash-hud" aria-label="Run statistics">
      <span class="dash-score" data-score-box>
        <span class="dash-pill"><span data-score>0</span><small>pts</small><span class="dash-mult" data-multiplier>×1</span></span>
        <span class="dash-chain" aria-hidden="true"><span data-chain-fill></span></span>
      </span>
      <span class="dash-pill dash-timer" aria-label="Run time">
        <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><circle cx="8" cy="9" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 6v3.5l2 1.5M6 1.5h4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span data-timer>0:00</span>
      </span>
      <span class="dash-pill dash-pill-points" aria-label="Gift points to spend at shops">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M2 6h12v3H2zM3 9h10v5H3zM7 6h2v8H7z" fill="currentColor"/><path d="M8 6C6 2 3 3 4 6M8 6c2-4 5-3 4 0" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        <span data-points>0</span>
      </span>
    </div>
    <div class="dash-perks" data-perks hidden></div>
    <div class="dash-delivery" data-delivery hidden>
      <span data-delivery-text></span>
      <span class="dash-delivery-bar" aria-hidden="true"><span data-delivery-fill></span></span>
    </div>
    <span class="dash-toast" data-toast hidden></span>
    <span class="dash-streak-call" data-streak-call aria-hidden="true" hidden></span>
    <span class="dash-snappy" data-snappy aria-hidden="true" hidden><span class="dash-snappy-word">SNAPPY</span><span class="dash-snappy-points" data-snappy-points></span></span>
    <div class="dash-swipe-hint" data-swipe-hint aria-hidden="true" hidden>
      <div class="dash-swipe-track">
        <svg class="dash-swipe-chevron dash-swipe-chevron-left" viewBox="0 0 16 12" width="20" height="15"><path d="M7 1L2 6l5 5M14 1L9 6l5 5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="dash-swipe-trail dash-swipe-trail-left"></span>
        <span class="dash-swipe-trail dash-swipe-trail-right"></span>
        <svg class="dash-swipe-hand" viewBox="0 0 13 17" width="26" height="34" shape-rendering="crispEdges">
          <path fill="#002855" d="M3 0h5v10H3zM6 5h7v6H6zM0 7h5v5H0zM1 8h12v7H1zM2 15h10v2H2z"/>
          <path fill="#FFF" d="M4 1h3v9H4zM7 6h5v4H7zM1 8h3v3H1zM2 9h10v5H2zM3 14h8v2H3z"/>
          <path fill="#002855" d="M9 6h1v3H9z"/>
        </svg>
        <svg class="dash-swipe-chevron dash-swipe-chevron-right" viewBox="0 0 16 12" width="20" height="15"><path d="M2 1l5 5-5 5M9 1l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <span class="dash-swipe-label">SWIPE TO STEER</span>
    </div>
    <div class="dash-tube" aria-hidden="true">
      <span class="dash-tube-liquid"></span>
      <span class="dash-tube-label" data-tube-label>BOOST</span>
    </div>
    <button class="dash-boost" type="button" data-action="boost" aria-label="Boost. Hold to go faster" disabled>
      <span class="dash-boost-label" data-boost-label>BOOST</span>
    </button>
    <div class="dash-overlay" data-overlay>
      <div class="dash-overlay-card" data-main-card>
        <span class="dash-eyebrow" data-eyebrow hidden></span>
        <h2 data-overlay-title>Delivery Dash</h2>
        <p data-overlay-message>Dodge the roadworks. Collect the gifts.</p>
        <form class="dash-submit" data-submit hidden>
          <input type="text" data-nickname maxlength="16" placeholder="Nickname for the leaderboard" autocomplete="nickname" aria-label="Nickname for the leaderboard" />
          <button type="submit" data-submit-button>Submit</button>
        </form>
        <p class="dash-board-note" data-board-note role="status" hidden></p>
        <div class="dash-rewards" data-rewards hidden></div>
        <div class="dash-actions">
          <button class="dash-start" type="button" data-action="start" disabled>Start driving</button>
          <button class="dash-start" type="button" data-action="leave-shop" hidden>Back on the road</button>
          <button class="dash-secondary" type="button" data-action="open-board">Leaderboard</button>
        </div>
        <p class="dash-howto" data-howto>
          <span class="dash-howto-keys">← → steer · ↑ boost</span>
          <span class="dash-howto-touch">Swipe to steer · hold BOOST</span>
        </p>
      </div>
      <div class="dash-overlay-card dash-board-card" data-board-card hidden>
        <h2>Leaderboard</h2>
        <div class="dash-board-tabs" role="tablist" aria-label="Leaderboard version">
          <button type="button" role="tab" data-board-tab="v02" aria-selected="true">v0.2 · Score</button>
          <button type="button" role="tab" data-board-tab="v01" aria-selected="false">v0.1 · Hall of Fame</button>
        </div>
        <input class="dash-board-search" type="search" data-board-search maxlength="16" placeholder="Search names" autocomplete="off" spellcheck="false" aria-label="Search leaderboard names" />
        <p class="dash-board-note" data-board-result role="status" hidden></p>
        <ol class="dash-board" data-board-list></ol>
        <p class="dash-board-empty" data-board-empty></p>
        <button class="dash-start" type="button" data-action="close-board">Back</button>
      </div>
    </div>
  </div>
  <footer class="dash-controls" aria-label="Keyboard controls">
    <span class="dash-key-group"><kbd>←</kbd><kbd>→</kbd><span>Steer</span></span>
    <span class="dash-key-group"><kbd>↑</kbd><span>Boost</span></span>
    <span class="dash-key-group"><kbd>P</kbd><span>Pause</span></span>
    <span class="dash-key-group"><kbd>M</kbd><span>Mute</span></span>
    <span class="dash-key-group"><kbd>F</kbd><span>Fullscreen</span></span>
  </footer>
  <span class="dash-sr-only" role="status" aria-live="polite" data-live-status></span>
</section>
