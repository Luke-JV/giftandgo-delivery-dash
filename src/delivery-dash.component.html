<section class="delivery-dash" aria-label="Gift and Go Delivery Dash driving game">
  <header class="dash-header">
    <img data-brand-logo width="88" height="21" alt="Gift&amp;Go" />
    <span class="dash-name">DELIVERY DASH<small>PACE <span data-speed>1.0×</span></small></span>
    <button class="dash-icon-button" type="button" data-action="fullscreen" aria-label="Enter fullscreen" aria-pressed="false">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" data-fullscreen-icon><path d="M1 6V1h5M10 1h5v5M15 10v5h-5M6 15H1v-5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    </button>
    <button class="dash-pause" type="button" data-action="pause" disabled>Pause</button>
  </header>
  <div class="dash-stats" aria-label="Run statistics">
    <div><span class="dash-stat-label">DISTANCE</span><span class="dash-stat-value"><span data-distance>0000</span><small>m</small></span></div>
    <div><span class="dash-stat-label">GIFT POINTS</span><span class="dash-stat-value" data-points>0</span></div>
    <div><span class="dash-stat-label">BEST</span><span class="dash-stat-value" data-best>0m</span></div>
  </div>
  <div class="dash-perks" data-perks hidden></div>
  <div class="dash-scene" data-scene>
    <canvas data-game-canvas width="240" height="230" aria-label="Three-lane road. Steer left and right to dodge cones, barriers, traffic drums and potholes. Collect gifts, and grab the rare golden coupon, as the pace increases."></canvas>
    <img class="dash-truck-logo" data-truck-logo alt="" aria-hidden="true" />
    <span class="dash-toast" data-toast hidden></span>
    <div class="dash-overlay" data-overlay>
      <div class="dash-overlay-card">
        <span class="dash-eyebrow" data-eyebrow>THE GIFT&amp;GO ROAD TRIP</span>
        <h2 data-overlay-title>Special delivery.</h2>
        <p data-overlay-message>Dodge the roadworks. Collect the gifts.</p>
        <div class="dash-board" data-board hidden>
          <span class="dash-board-title">TOP DRIVERS</span>
          <ol data-board-list></ol>
        </div>
        <p class="dash-board-note" data-board-note role="status" hidden></p>
        <form class="dash-submit" data-submit hidden>
          <input type="text" data-nickname maxlength="16" placeholder="Your nickname" autocomplete="nickname" aria-label="Nickname for the leaderboard" />
          <button type="submit" data-submit-button>Submit score</button>
        </form>
        <button class="dash-start" type="button" data-action="start" disabled>Start driving</button>
        <div class="dash-rewards" data-rewards hidden></div>
        <button class="dash-start" type="button" data-action="leave-shop" hidden>Back on the road</button>
      </div>
    </div>
  </div>
  <footer class="dash-controls">
    <button class="dash-steer" type="button" data-action="left" aria-label="Move one lane left" disabled>←</button>
    <div class="dash-help"><span>Steer with ← → or A / D</span><small>Tap either side or swipe on mobile</small></div>
    <button class="dash-steer" type="button" data-action="right" aria-label="Move one lane right" disabled>→</button>
  </footer>
  <span class="dash-sr-only" role="status" aria-live="polite" data-live-status></span>
</section>
