<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Gift&Go Delivery Dash</title><style>body{margin:0;padding:16px;background:#F4F6FB;font-family:system-ui} @media(max-width:400px){body{padding:0}}</style></head><body>
<div id="giftgo-delivery-dash-preview">
<section class="delivery-dash" aria-label="Gift and Go Delivery Dash driving game">
  <header class="dash-header">
    <img data-brand-logo width="88" height="21" alt="Gift&amp;Go" />
    <span class="dash-name">DELIVERY DASH<small>PACE <span data-speed>1.0×</span></small></span>
    <button class="dash-icon-button" type="button" data-action="fullscreen" aria-label="Enter fullscreen" aria-pressed="false">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" data-fullscreen-icon><path d="M1 6V1h5M10 1h5v5M15 10v5h-5M6 15H1v-5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    </button>
    <button class="dash-pause" type="button" data-action="pause" disabled>Pause</button>
  </header>
  <div class="dash-stats" aria-label="Run statistics">
    <div><span class="dash-stat-label">DISTANCE</span><span class="dash-stat-value"><span data-distance>0000</span><small>m</small></span></div>
    <div><span class="dash-stat-label">GIFT POINTS</span><span class="dash-stat-value" data-points>0</span></div>
    <div><span class="dash-stat-label">BEST</span><span class="dash-stat-value" data-best>0m</span></div>
  </div>
  <div class="dash-perks" data-perks hidden></div>
  <div class="dash-scene" data-scene>
    <canvas data-game-canvas width="240" height="230" aria-label="Three-lane road. Steer left and right to dodge cones, barriers, traffic drums and potholes. Collect gifts, and grab the rare golden coupon, as the pace increases."></canvas>
    <img class="dash-truck-logo" data-truck-logo alt="" aria-hidden="true" />
    <span class="dash-toast" data-toast hidden></span>
    <div class="dash-overlay" data-overlay>
      <div class="dash-overlay-card">
        <span class="dash-eyebrow" data-eyebrow>THE GIFT&amp;GO ROAD TRIP</span>
        <h2 data-overlay-title>Special delivery.</h2>
        <p data-overlay-message>Dodge the roadworks. Collect the gifts.</p>
        <button class="dash-start" type="button" data-action="start" disabled>Start driving</button>
        <div class="dash-rewards" data-rewards hidden></div>
        <button class="dash-start" type="button" data-action="leave-shop" hidden>Back on the road</button>
      </div>
    </div>
  </div>
  <footer class="dash-controls">
    <button class="dash-steer" type="button" data-action="left" aria-label="Move one lane left" disabled>←</button>
    <div class="dash-help"><span>Steer with ← → or A / D</span><small>Tap either side or swipe on mobile</small></div>
    <button class="dash-steer" type="button" data-action="right" aria-label="Move one lane right" disabled>→</button>
  </footer>
  <span class="dash-sr-only" role="status" aria-live="polite" data-live-status></span>
</section>

</div>
<style>

.delivery-dash, .delivery-dash * { box-sizing: border-box; }
.delivery-dash { width: 100%; max-width: 480px; margin-inline: auto; overflow: hidden; border-radius: 14px; background: #002855; color: #fff; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.delivery-dash button { font: inherit; cursor: pointer; }
.delivery-dash button:focus-visible { outline: 3px solid #FFC35B; outline-offset: -3px; }
.delivery-dash button:disabled { cursor: default; opacity: 0.45; }
.dash-header { display: flex; align-items: center; gap: 12px; padding: 17px 18px 12px; }
.dash-header img { display: block; object-fit: contain; }
.dash-name { font-size: 10px; font-weight: 650; letter-spacing: 1.5px; color: #C6D5E8; flex: 1; }
.dash-name small { display: block; margin-top: 4px; font-size: 10px; letter-spacing: 0.5px; color: #FFC35B; font-variant-numeric: tabular-nums; }
.dash-icon-button { display: grid; place-items: center; width: 36px; min-height: 36px; padding: 0; background: #123C68; border: 0; border-radius: 6px; color: #FFF; }
.dash-pause { min-height: 36px; background: #123C68; border: 0; border-radius: 6px; color: #FFF; font-size: 12px !important; padding: 6px 12px; }
.dash-stats { display: flex; justify-content: space-between; gap: 10px; padding: 0 20px 14px; }
.dash-stats > div { display: flex; flex-direction: column; gap: 3px; }
.dash-stats > div:last-child { text-align: right; }
.dash-stat-label { color: #AEC3DC; font-size: 10px; font-weight: 650; letter-spacing: 1.2px; }
.dash-stat-value { font-size: 21px; line-height: 1.2; font-weight: 650; font-variant-numeric: tabular-nums; }
.dash-stat-value small { font-size: 12px; margin-left: 3px; color: #AEC3DC; }
.dash-perks { padding: 0 18px 10px; color: #FFCF80; text-align: center; font-size: 11px; }
.dash-perks[hidden], .dash-toast[hidden], .dash-start[hidden], .dash-rewards[hidden] { display: none; }
.dash-toast { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); padding: 6px 12px; border-radius: 5px; background: #002855EB; color: #FFCF80; font-weight: 650; font-size: 12px; white-space: nowrap; pointer-events: none; }
.delivery-dash:is([data-state="reward"], [data-state="shop"]) .dash-overlay { padding-top: 16px; }
.delivery-dash:is([data-state="reward"], [data-state="shop"]) .dash-overlay-card { padding: 16px; }
.delivery-dash:is([data-state="reward"], [data-state="shop"]) .dash-overlay p { margin-bottom: 7px; }
.dash-scene { position: relative; width: 100%; overflow: hidden; background: #F4F6FB; }
.dash-scene canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; touch-action: pan-y; }
.dash-truck-logo { position: absolute; display: block; height: auto; image-rendering: auto; max-width: none; pointer-events: none; visibility: hidden; }
.dash-overlay { position: absolute; inset: 0; display: flex; align-items: flex-start; justify-content: center; padding: 38px 16px 0; background: linear-gradient(#F4F6FBAA, #F4F6FB00 65%); }
.dash-overlay[hidden] { display: none; }
.dash-overlay-card { width: 100%; max-width: 330px; background: #FFF; color: #002855; text-align: center; padding: 20px 15px; border-radius: 10px; box-shadow: 0 5px 20px #00285518; }
.dash-eyebrow { display: block; color: #7A6650; font-size: 9px; font-weight: 650; letter-spacing: 1.8px; }
.dash-overlay h2 { margin: 8px 0; font-size: 25px; line-height: 1.15; font-weight: 750; letter-spacing: -0.7px; }
.dash-overlay p { margin: 0 0 16px; font-size: 12px; line-height: 1.6; color: #55647A; }
.dash-start { border: 0; border-radius: 7px; background: #ED8B00; color: #0A1D40; min-height: 44px; padding: 10px 25px; font-weight: 750 !important; font-size: 13px !important; }
.dash-start:hover { background: #F5A21A; }
.dash-controls { display: flex; align-items: center; gap: 10px; padding: 12px; }
.dash-steer { flex-shrink: 0; width: 48px; min-height: 44px; border: 1px solid #41638A; border-radius: 7px; background: #123C68; color: #FFF; font-size: 22px !important; }
.dash-steer:not(:disabled):active { background: #ED8B00; color: #002855; }
.dash-help { flex: 1; text-align: center; font-size: 12px; line-height: 1.5; }
.dash-help small { display: block; font-size: 10px; color: #AEC3DC; }
.dash-sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
@media (max-width: 380px) {
  .delivery-dash:is([data-state="reward"], [data-state="shop"]) .dash-scene { min-height: 306px; }
  .delivery-dash:is([data-state="reward"], [data-state="shop"]) .dash-overlay { padding-top: 10px; }
  .delivery-dash:is([data-state="reward"], [data-state="shop"]) .dash-overlay-card { padding: 12px; }
  .delivery-dash:is([data-state="reward"], [data-state="shop"]) .dash-overlay h2 { margin: 6px 0; }
  .delivery-dash:is([data-state="reward"], [data-state="shop"]) .dash-overlay p { font-size: 11px; line-height: 1.4; }
  .delivery-dash:is([data-state="reward"], [data-state="shop"]) .dash-rewards { gap: 6px; margin-top: 9px; }
  .delivery-dash:is([data-state="reward"], [data-state="shop"]) .dash-rewards button { min-height: 44px; padding: 7px 10px; }
  .dash-header { gap: 8px; padding: 12px 12px 10px; }
  .dash-name { font-size: 9px; letter-spacing: 0.7px; }
  .dash-overlay { padding-top: 18px; }
  .dash-overlay-card { max-width: 260px; padding: 14px 12px; }
  .dash-overlay h2 { font-size: 22px; }
  .dash-eyebrow { letter-spacing: 1px; }
  .dash-help { font-size: 11px; }
  .dash-help small { font-size: 10px; }
}
@media (max-width: 280px) {
  .delivery-dash:is([data-state="reward"], [data-state="shop"]) .dash-eyebrow { display: block; }
  .dash-name { display: none; }
  .dash-header { justify-content: space-between; }
  .dash-overlay { padding: 10px; }
  .dash-overlay h2 { font-size: 19px; }
  .dash-eyebrow { display: none; }
  .dash-overlay-card { padding: 10px; }
  .dash-overlay p { margin-bottom: 8px; }
  .dash-help small { display: none; }
}

.dash-rewards { display: grid; gap: 8px; margin-top: 12px; }
.delivery-dash:is([data-state="reward"], [data-state="shop"]) .dash-scene { min-height: 340px; }
.dash-rewards button { --accent: #ED8B00; position: relative; display: flex; align-items: center; gap: 12px; padding: 9px 12px 9px 9px; min-height: 56px; text-align: left; color: #FFF; background: linear-gradient(100deg, #0B3A6B, #123C68); border: 1px solid #41638A; border-left: 4px solid var(--accent); border-radius: 8px; transition: transform 0.12s, box-shadow 0.12s; }
.dash-rewards button:not(:disabled):hover, .dash-rewards button:not(:disabled):focus-visible { transform: translateY(-1px); box-shadow: 0 0 0 2px var(--accent), 0 6px 14px #00285540; }
.dash-rewards button:not(:disabled):active { transform: scale(0.98); }
.dash-rewards svg { flex-shrink: 0; width: 34px; height: 34px; padding: 5px; border-radius: 50%; background: var(--accent); color: #FFF; }
.dash-rewards .dash-reward-shield { --accent: #1FA3B5; }
.dash-rewards .dash-reward-magnet { --accent: #D9381E; }
.dash-rewards .dash-reward-double { --accent: #E5A100; }
.dash-reward-text { display: flex; flex-direction: column; gap: 2px; }
.dash-rewards strong { font-size: 13px; letter-spacing: 0.2px; }
.dash-reward-text span { font-size: 10px; line-height: 1.35; color: #C6D5E8; }
.delivery-dash:is([data-state="reward"], [data-state="shop"]) .dash-overlay { background: radial-gradient(circle at 50% 30%, #FFC35B55, #00285599 80%); }
.delivery-dash:is([data-state="reward"], [data-state="shop"]) .dash-overlay-card { background: #002855; color: #FFF; border: 2px dashed #FFC35B; box-shadow: 0 0 0 4px #002855, 0 0 28px #ED8B0088; }
.delivery-dash:is([data-state="reward"], [data-state="shop"]) .dash-eyebrow { color: #FFC35B; }
.delivery-dash:is([data-state="reward"], [data-state="shop"]) .dash-overlay h2 { font-size: 34px; letter-spacing: 6px; margin: 4px 0; color: #FFC35B; text-shadow: 0 2px 0 #B05F00; }
.delivery-dash:is([data-state="reward"], [data-state="shop"]) .dash-overlay p { color: #C6D5E8; }
.delivery-dash.dash-fullscreen { position: fixed; inset: 0; z-index: 2147483000; width: 100vw; height: 100vh; height: 100dvh; max-width: none; border-radius: 0; display: flex; flex-direction: column; justify-content: center; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
.dash-fullscreen .dash-scene { width: min(100%, calc((100dvh - 190px) * 240 / 230)); min-width: 240px; margin-inline: auto; align-self: center; }
.dash-fullscreen .dash-header, .dash-fullscreen .dash-stats, .dash-fullscreen .dash-controls { width: min(100%, 640px); margin-inline: auto; }
@media (orientation: landscape) and (max-height: 520px) {
  .dash-fullscreen .dash-scene { width: min(100%, calc((100dvh - 100px) * 240 / 230)); }
  .dash-fullscreen .dash-header { padding: 6px 14px; }
  .dash-fullscreen .dash-stats { padding-bottom: 4px; }
  .dash-fullscreen .dash-stat-value { font-size: 15px; }
  .dash-fullscreen .dash-help { display: none; }
  .dash-fullscreen .dash-controls { padding: 4px 12px; justify-content: space-between; }
  .delivery-dash:is([data-state="reward"], [data-state="shop"]) .dash-overlay-card { padding: 8px 12px; }
  .delivery-dash:is([data-state="reward"], [data-state="shop"]) .dash-overlay h2 { font-size: 22px; letter-spacing: 4px; }
  .delivery-dash:is([data-state="reward"], [data-state="shop"]) .dash-overlay p { display: none; }
  .delivery-dash:is([data-state="reward"], [data-state="shop"]) .dash-rewards { gap: 4px; margin-top: 4px; }
  .dash-rewards button { min-height: 40px; }
}
.dash-fullscreen .dash-overlay-card { max-width: min(420px, 90%); }
.dash-reward-cost { margin-left: auto; padding-left: 8px; font-style: normal; font-weight: 750; font-size: 12px; color: #FFC35B; font-variant-numeric: tabular-nums; white-space: nowrap; }
.delivery-dash[data-state="shop"] .dash-scene { min-height: 480px; }
.delivery-dash[data-state="shop"] .dash-rewards { margin-bottom: 12px; }
.delivery-dash[data-state="shop"] .dash-rewards button { min-height: 50px; }
.dash-rewards button:disabled { filter: grayscale(0.7); }

</style>

            const time = e.elapsed + this.idleTime / 18;
            for (let i = 0; i < 4; i++) {
                const age = (time * 1.7 + i * 0.24) % 1;
                this.ctx.globalAlpha = (1 - age) * 0.32;
                this.rect('#C8D0CC', left + 4 - age * 4, p.y + 1 + age * 17, 3 + age * 5, 2 + age * 4);
            }
            this.ctx.globalAlpha = 1;
        }
        const ghost = e.ghostUntil > e.elapsed;
        const flicker = ghost && !this.motion.matches ? 0.45 + 0.15 * Math.sin(e.elapsed * 30) : ghost ? 0.5 : 1;
        this.ctx.globalAlpha = flicker;
        this.ctx.drawImage(this.truck, left, top, width, height);
        this.ctx.globalAlpha = 1;
        this.logo.style.opacity = String(flicker);
        const calm = this.motion.matches, time = e.elapsed;
        if (e.shields > 0 || e.invulnerableUntil > e.elapsed) {
            this.ctx.globalAlpha = 0.14 + 0.04 * e.shields;
            this.ctx.fillStyle = '#8ED5DD';
            this.ctx.beginPath();
            this.ctx.ellipse(p.x, top + 38, 32, 44, 0, 0, Math.PI * 2);
            this.ctx.fill();
            this.ctx.globalAlpha = 1;
            for (let i = 0; i < 18; i++) {
                const angle = i * Math.PI * 2 / 18;
                this.rect(i % 3 ? '#8ED5DD' : '#D7F6EE', p.x + Math.cos(angle) * 29, top + 37 + Math.sin(angle) * 42, 2, 2);
            }
            for (let i = 0; i < e.shields; i++)
                this.rect('#D7F6EE', p.x - 8 + i * 8, top - 6, 5, 5);
        }
        if (e.magnetUntil > time && !calm) {
            for (let i = 0; i < 14; i++) {
                const angle = time * 3 + i * Math.PI * 2 / 14, reach = 58 + 4 * Math.sin(time * 4 + i);
                this.rect(i % 2 ? '#FF6A4D' : '#FFD1C8', p.x + Math.cos(angle) * reach, top + 60 + Math.sin(angle) * 16, 3, 3);
            }
        }
        if ((e.doubleUntil > time || e.jackpotUntil > time) && !calm) {
            const jackpot = e.jackpotUntil > time;
            for (let i = 0; i < (jackpot ? 10 : 5); i++) {
                const age = (time * (jackpot ? 1.8 : 1.1) + i * 0.37) % 1;
                this.rect(jackpot ? (i % 2 ? '#C58BFF' : '#FFE08A') : '#FFC35B', p.x - 24 + ((i * 17) % 48), top + 66 - age * 70, 3, 3);
            }
        }
        if (ghost && !calm)
            for (let i = 0; i < 6; i++) {
                const age = (time * 1.4 + i * 0.17) % 1;
                this.rect('#BFD0FF', p.x - 20 + ((i * 13) % 40), top + 70 + age * 20, 3, 4);
            }
        const pickupAge = e.elapsed - e.lastPickupAt;
        if (!this.motion.matches && pickupAge >= 0 && pickupAge < 0.4) {
            for (let i = 0; i < 8; i++) {
                const angle = i * Math.PI / 4, radius = 12 + pickupAge * 65;
                this.rect(i % 2 ? '#ED8B00' : '#FFE2A6', p.x + Math.cos(angle) * radius, top + 12 + Math.sin(angle) * radius * 0.5 - pickupAge * 25, 2, 2);
            }
        }
        if (moving) {
            const tread = Math.floor((e.distance + this.idleTime) * 0.7) % 3;
            this.rect('#596273', left + 4, top + height - 3 + tread, 4, 1);
            this.rect('#596273', left + width - 8, top + height - 3 + tread, 4, 1);
        }
        const s = this.displayScale;
        this.logo.style.left = `${(left + 7) * s}px`;
        this.logo.style.top = `${(top + 34) * s}px`;
        this.logo.style.width = `${34 * s}px`;
        this.logo.style.visibility = 'visible';
    }
    destroy() {
        if (this.destroyed)
            return;
        this.destroyed = true;
        if (this.frame)
            this.win.cancelAnimationFrame(this.frame);
        this.frame = 0;
        this.abort.abort();
        this.observer.disconnect();
        this.intersection.disconnect();
    }
}

const root=document.getElementById("giftgo-delivery-dash-preview").querySelector(".delivery-dash");
const game=new DeliveryDashGame(root,window);
root.deliveryDash=game;
window.addEventListener("pagehide",()=>game.destroy(),{once:true});
})();
</script>
